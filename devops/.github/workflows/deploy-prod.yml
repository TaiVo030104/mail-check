name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: 'Backend branch/tag to deploy'
        required: false
        default: 'main'
      frontend_branch:
        description: 'Frontend branch/tag to deploy'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Create Dynamic Inventory
        run: |
          cd ansible
          cat > inventory-prod.ini << EOF
          [production]
          prod_server ansible_host=${{ secrets.PROD_SERVER_IP }} ansible_user=ubuntu
          
          [production:vars]
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          
          # App Configuration
          app_name=prod
          domain_name=mail.nguyenanhhao.site
          backend_branch=${{ github.event.inputs.backend_branch || 'main' }}
          frontend_branch=${{ github.event.inputs.frontend_branch || 'main' }}
          
          # Repositories
          backend_repo=https://github.com/awad-final-project/backend.git
          frontend_repo=https://github.com/awad-final-project/frontend.git
          
          # GitHub
          github_user=awad-final-project
          github_token=${{ secrets.GHCR_TOKEN }}
          
          # MongoDB Atlas
          mongo_uri=${{ secrets.PROD_MONGO_URI }}
          mongo_db=user_registration
          
          # JWT
          jwt_secret=${{ secrets.JWT_SECRET }}
          jwt_expires_in=7d
          jwt_refresh_secret=${{ secrets.JWT_REFRESH_SECRET }}
          jwt_refresh_expires_in=30d
          
          # Google OAuth
          google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}
          
          # Google Gemini AI
          gemini_api_key=${{ secrets.GEMINI_API_KEY }}
          
          # SSL
          ssl_email=${{ secrets.SSL_EMAIL || 'anhhao012004@gmail.com' }}
          EOF

      - name: Deploy Production Environment
        run: |
          cd ansible
          ansible-playbook -i inventory-prod.ini deploy.yml

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Production deployment completed!"
          echo "🌐 URL: https://mail.nguyenanhhao.site"
          echo "📦 Backend: ${{ github.event.inputs.backend_branch || 'main' }}"
          echo "📦 Frontend: ${{ github.event.inputs.frontend_branch || 'main' }}"
