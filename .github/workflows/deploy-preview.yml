name: Deploy Preview Environment

on:
  repository_dispatch:
    types: [deploy-preview]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Preview app name (e.g., preview-feature-x)'
        required: true
      backend_branch:
        description: 'Backend branch'
        required: true
      frontend_branch:
        description: 'Frontend branch'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PREVIEW_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PREVIEW_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Extract deployment info
        id: info
        run: |
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          BACKEND_BRANCH="${{ github.event.client_payload.branch_backend || github.event.inputs.backend_branch }}"
          FRONTEND_BRANCH="${{ github.event.client_payload.branch_frontend || github.event.inputs.frontend_branch }}"
          DOMAIN_PREFIX="${{ github.event.client_payload.domain_prefix || github.event.inputs.app_name }}"
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "backend_branch=$BACKEND_BRANCH" >> $GITHUB_OUTPUT
          echo "frontend_branch=$FRONTEND_BRANCH" >> $GITHUB_OUTPUT
          echo "domain=${DOMAIN_PREFIX}.mail-dev.nguyenanhhao.site" >> $GITHUB_OUTPUT

      - name: Create Dynamic Inventory
        run: |
          cd ansible
          cat > inventory-preview.ini << EOF
          [preview]
          preview_server ansible_host=${{ secrets.PREVIEW_SERVER_IP }} ansible_user=ubuntu
          
          [preview:vars]
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          
          # App Configuration
          app_name=${{ steps.info.outputs.app_name }}
          domain_name=${{ steps.info.outputs.domain }}
          backend_branch=${{ steps.info.outputs.backend_branch }}
          frontend_branch=${{ steps.info.outputs.frontend_branch }}
          
          # Repositories
          backend_repo=https://github.com/awad-final-project/backend.git
          frontend_repo=https://github.com/awad-final-project/frontend.git
          
          # GitHub
          github_user=awad-final-project
          github_token=${{ secrets.GHCR_TOKEN }}
          
          # MongoDB Atlas
          mongo_uri=${{ secrets.PREVIEW_MONGO_URI }}
          mongo_db=user_registration
          
          # JWT
          jwt_secret=${{ secrets.JWT_SECRET }}
          jwt_expires_in=7d
          jwt_refresh_secret=${{ secrets.JWT_REFRESH_SECRET }}
          jwt_refresh_expires_in=30d
          
          # Google OAuth
          google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}
          google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}
          
          # SSL
          ssl_email=${{ secrets.SSL_EMAIL || 'anhhao012004@gmail.com' }}
          EOF

      - name: Deploy Preview Environment
        run: |
          cd ansible
          ansible-playbook -i inventory-preview.ini deploy.yml

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Preview deployment completed!"
          echo "🌐 URL: https://${{ steps.info.outputs.domain }}"
          echo "📦 Backend: ${{ steps.info.outputs.backend_branch }}"
          echo "📦 Frontend: ${{ steps.info.outputs.frontend_branch }}"
          echo ""
          echo "⚠️ Note: Max 2 preview environments allowed. Oldest will be auto-removed."
