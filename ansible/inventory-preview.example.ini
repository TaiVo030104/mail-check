# Example Inventory for Preview Environments
# Copy to inventory-preview.ini and fill in your values

[preview]
preview_server ansible_host=YOUR_SERVER_IP ansible_user=ubuntu

[preview:vars]
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

# App Configuration (will be set dynamically by workflow)
app_name=preview-feature-x
domain_name=preview-feature-x.mail-dev.nguyenanhhao.site
backend_branch=feature/x
frontend_branch=feature/x

# Repositories
backend_repo=https://github.com/awad-final-project/backend.git
frontend_repo=https://github.com/awad-final-project/frontend.git

# GitHub
github_user=awad-final-project
github_token=YOUR_GHCR_TOKEN

# MongoDB Atlas
mongo_uri=mongodb+srv://user:password@cluster.mongodb.net/?retryWrites=true&w=majority
mongo_db=user_registration

# JWT
jwt_secret=your-super-secret-jwt-key-min-32-chars
jwt_expires_in=7d
jwt_refresh_secret=your-super-secret-refresh-key-min-32-chars
jwt_refresh_expires_in=30d

# Google OAuth
google_client_id=your-google-client-id.apps.googleusercontent.com
google_client_secret=your-google-client-secret

# SSL
ssl_email=your-email@example.com
